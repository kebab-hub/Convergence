name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Run dedicated-server GameTests
        run: ./gradlew runGameTestServer --no-daemon --stacktrace

      - name: Validate data generation
        run: ./gradlew runData --no-daemon --stacktrace

      - name: Check generated resources are committed
        run: |
          if [ -n "$(git status --porcelain -- src/generated/resources)" ]; then
            git diff -- src/generated/resources
            git status --short -- src/generated/resources
            echo 'Generated resources changed. Run ./gradlew runData and commit the results.'
            exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: subspace-java17
          path: build/libs/*.jar
          if-no-files-found: error
